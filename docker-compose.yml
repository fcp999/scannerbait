services:
  scannerbait:
    build: .
    container_name: scannerbait
    ports:
      - "8099:80"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    environment:
      - PYTHONUNBUFFERED=1
      - SCANNERBAIT_RAW_CONTROLS=${SCANNERBAIT_RAW_CONTROLS:-1}
      # Ship events to the syslog collector on the host (promtail -> loki).
      # The docker0 gateway address works from an isolated compose bridge;
      # the collector's container name does not resolve across networks.
      - SCANNERBAIT_SYSLOG=${SCANNERBAIT_SYSLOG:-172.17.0.1:514}
      # Hostname the decoys present themselves as, so a probe sees the box's
      # own name rather than an obvious placeholder.
      - SCANNERBAIT_SERVERNAME=${SCANNERBAIT_SERVERNAME:-intranet-dc01.fcp3.me}
